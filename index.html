<!DOCTYPE html>
<html lang="id" translate="no">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ ICON & PWA CONFIG -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#667eea" />

    <!-- ✅ APP META -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ojek-O Delivery App — Delivery Management System" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ojek-O" />

    <!-- 🔥 ANTI-TRANSLATION META TAGS -->
    <meta name="google" content="notranslate">
    <meta name="googlebot" content="notranslate">
    <meta http-equiv="Content-Language" content="id">
    <meta name="robots" content="notranslate">

    <!-- ✅ TITLE -->
    <title>Ojek-O App</title>
   
    <!-- ✅ EXTERNAL STYLES -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />

    <!-- ✅ GLOBAL RESET (Pengganti index.css yang dihapus) -->
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      * {
        box-sizing: border-box;
      }
    </style>
  </head>

  <body translate="no">
    <noscript>
      <strong>Ojek-O App membutuhkan JavaScript untuk berjalan dengan baik.</strong>
    </noscript>

    <div id="root"></div>

    <!-- ✅ MAIN SCRIPT -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- ✅ DAFTARKAN SERVICE WORKER UNTUK PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('✅ Service Worker PWA berhasil didaftarkan:', registration.scope);
            })
            .catch(error => {
              console.error('❌ Gagal mendaftarkan Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
